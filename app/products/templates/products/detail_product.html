{% extends 'base.html' %}

{% block title %}{{product.name}}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card rounded-0 border-dark border-2 p-4 p-md-5">
        <h1 class="display-5 fw-bold text-black mb-3">{{ product.name }}</h1>
        <p class="fs-4 fw-bold text-black mb-3">Ціна: ${{ product.price }}</p>
        <p class="fs-5 text-dark mb-4">{{ product.content }}</p>
        <div>
            <a href="{{ url_for('products.all_products') }}" class="btn btn-outline-dark border-2 rounded-0 px-4 py-2 text-uppercase small">
                Назад до списку
            </a>
        </div>
    </div>
</div>
{% endblock %}
