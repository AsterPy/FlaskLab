{% extends 'base.html' %}

{% block title %}Products Page{% endblock %}

{% block content %}
<div class="container py-5">
    <h1 class="display-5 fw-bold text-black mb-4">Products</h1>
    <div class="row g-4">
        {% for product in products %}
        <div class="col-12 col-md-6 col-lg-4">
            <a  href="{{ url_for('products.get_product', product_id=product.id) }}" class="card rounded-0 border-dark border-2 p-4 h-100 d-flex flex-column justify-content-between">
                <div>
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <h3 class="h4 fw-bold text-black mb-0">{{ product.name }}</h3>
                    </div>
                </div>
               </a>
        </div>
        {% else %}
        <div class="col-12">
            <p class="text-secondary">Список порожній</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
