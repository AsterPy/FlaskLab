{% extends 'base.html' %}

{% block title %}Account{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 600px;">
    <div class="card border-dark border-2 rounded-0 shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3 fw-bold mb-2">Welcome, {{ current_user.username }}!</h1>
            <p class="text-muted mb-2">You have successfully logged in to your profile.</p>
            <p class="mb-4"><strong>Email:</strong> {{ current_user.email }}</p>
            <div class="d-flex gap-2">
                <a href="{{ url_for('users.all_users') }}" class="btn btn-outline-dark rounded-0">Users List</a>
                <a href="{{ url_for('users.logout') }}" class="btn btn-outline-danger rounded-0">Logout</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
